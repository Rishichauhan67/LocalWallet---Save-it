<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Save Anything</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./CSS/dashboard.css">
    <style>

    </style>
</head>

<body>

    <!--NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#home">Save Anything</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="./index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#features">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./usecase.html">Use Case</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="./faq.html">About</a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#authModal"
                        data-auth="login">
                        Login
                    </button>

                    <!-- Get Started Button -->
                    <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#authModal"
                        data-auth="signup">
                        Get Started
                    </button>
                </div>
            </div>
        </div>
    </nav>


    <!-- DASHBOARD -->
    <main class="dashboard">
        <div class="container">
            <!-- Header -->
            <div class="items-header">
                <h3>Saved Items</h3>
                <span class="items-count" id="itemsCount">0 items</span>
            </div>

            <!-- Save Anything Input with Note Popover -->
            <div class="save-input-wrapper">
                <div class="save-input-main position-relative">
                    <i class="bi bi-plus-circle"></i>
                    <input type="text" id="saveAnythingInput" placeholder="Paste a link or type anything to save..."
                        autocomplete="off" />

                    <!-- Small Floating Note Popover -->
                    <div class="quick-note-popup" id="quickNotePopup">
                        <div class="note-popup-header">
                            <span class="note-popup-title">
                                <i class="bi bi-journal-text"></i> Add a Note
                            </span>
                            <button type="button" class="note-close-btn" id="closeNoteBtn" aria-label="Close note">
                                &times;
                            </button>
                        </div>
                        <textarea id="itemNoteInput" class="note-textarea" rows="2"
                            placeholder="Add quick notes, tags, or reminders..."></textarea>
                    </div>
                </div>

                <div class="save-input-actions">
                    <select id="contentType" class="content-type-select">
                        <option value="auto">Auto Detect</option>
                        <option value="text">Text</option>
                        <option value="link">Website Link</option>
                        <option value="image">Image / Screenshot</option>
                        <option value="reel">Instagram Reel</option>
                    </select>

                    <button type="button" class="save-btn" id="saveAnythingBtn">
                        <i class="bi bi-plus-lg"></i>
                        Save
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="filters-row">
                <select class="filter-select" id="typeFilter">
                    <option value="all">All Types</option>
                    <option value="text">Text</option>
                    <option value="link">Link</option>
                    <option value="image">Image</option>
                    <option value="reel">Reel</option>
                </select>

                <select class="filter-select" id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Study">Study</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                </select>

                <button type="button" class="favorite-filter" id="favoritesFilter">
                    <i class="bi bi-star"></i>
                    Favorites
                </button>
            </div>

            <!-- Saved Items Grid -->
            <div class="row g-4" id="savedItemsContainer">
                <!-- JavaScript will render saved item cards here -->
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-icon">
                    <i class="bi bi-inbox"></i>
                </div>
                <h4>No saved items found</h4>
                <p>
                    Save a text note, website link, image, or Instagram Reel to find it here
                    later.
                </p>
                <a href="#" class="save-btn">
                    <i class="bi bi-plus-lg"></i>
                    Save Anything
                </a>
            </div>
        </div>
    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./JS/app.js"></script>

</body>

</html>
